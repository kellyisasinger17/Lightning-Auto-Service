[build]
  publish = "."
  command = "npm run build"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

# Enforce extensionless public URLs. `force` is required because the source
# `.html` files also exist in the publish directory.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/service.html"
  to = "/schedule"
  status = 301
  force = true

